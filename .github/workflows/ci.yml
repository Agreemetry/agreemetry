name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: End-to-end test in Chrome
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 60); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          npm run test:e2e -- http://localhost:4173/ e2e-shots "$(which google-chrome)"
      - name: Keep screenshots when the end-to-end test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots
          path: e2e-shots
